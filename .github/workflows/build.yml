name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Bauen
        run: gradle build --stacktrace --no-daemon

      - name: Jar prüfen
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources)
          echo "JAR=$JAR" >> $GITHUB_ENV
          echo "VERSION=$(grep '^mod_version' gradle.properties | cut -d= -f2)" >> $GITHUB_ENV
          unzip -l "$JAR"
          echo "--- refmap ---"
          unzip -p "$JAR" '*refmap.json' || echo "(kein refmap)"
          echo "--- Mixin-Ziele im Bytecode ---"
          mkdir -p /tmp/chk && cd /tmp/chk && unzip -q -o "$GITHUB_WORKSPACE/$JAR"
          for c in de/junglecraft/mod/mixin/*.class de/junglecraft/mod/Junglecraft.class; do
            echo "== $c"; javap -v "$c" | grep -E "Utf8 .*(method_|class_|net/minecraft|renderPanorama|renderLogo|init)" | sed 's/.*Utf8 //' | sort -u
          done

      - uses: actions/upload-artifact@v4
        with:
          name: junglecraft-mod
          path: ${{ env.JAR }}

      - name: Jar in Branch "dist" ablegen
        run: |
          mkdir -p /tmp/dist && cp "$JAR" /tmp/dist/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan dist
          git rm -rf . -q
          cp /tmp/dist/*.jar .
          git add *.jar
          git commit -m "Build ${GITHUB_SHA::7}" -q
          git push -f origin dist

      - name: Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v" -y --cleanup-tag 2>/dev/null || true
          gh release delete "v$VERSION" -y --cleanup-tag 2>/dev/null || true
          gh release create "v$VERSION" "/tmp/dist/$(basename $JAR)" --target "$GITHUB_SHA" \
            --title "Junglecraft Mod $VERSION" --notes "Für Minecraft 1.21.11 (Fabric). Einfach in den mods-Ordner legen."
