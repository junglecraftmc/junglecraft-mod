name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Verfügbare Loom-Versionen (Info)
        run: curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<version>1\.1[3-9][^<]*' | sed 's/<version>//' | tail -15 || true

      - name: Bauen
        run: gradle build --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: junglecraft-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
