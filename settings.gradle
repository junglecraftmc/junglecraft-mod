pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'fabric-loom' version providers.gradleProperty('loom_version').get()
    }
}

rootProject.name = 'junglecraft-mod'
